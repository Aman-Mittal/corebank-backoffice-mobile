# The backend the `backend` e2e projects run against: PostgreSQL plus the upstream Apache Fineract
# image, which this project only talks to over its REST API. Adapted from fineract-backoffice-ui.
#
# Container names and host ports differ from that project's stack so both can exist side by side;
# memory is capped because the backend needs about 1 GB and the e2e host is shared (DOCS/E2E.md).
name: mfi-e2e

services:
  db:
    image: postgres:15
    container_name: mbo-e2e-db
    ports:
      - '${MBO_E2E_DB_PORT:-5434}:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - mbo-e2e-postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    image: apache/fineract:latest
    container_name: mbo-e2e-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${MBO_E2E_API_PORT:-8443}:8443'
    mem_limit: 1536m
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx1g -XX:+UseSerialGC
      - FINERACT_HIKARI_JDBC_URL=jdbc:postgresql://db:5432/fineract_tenants
      - FINERACT_HIKARI_USERNAME=postgres
      - FINERACT_HIKARI_PASSWORD=postgres
      - FINERACT_DEFAULT_TENANTDB_HOSTNAME=db
      - FINERACT_DEFAULT_TENANTDB_PORT=5432
      - FINERACT_DEFAULT_TENANTDB_UID=postgres
      - FINERACT_DEFAULT_TENANTDB_PWD=postgres
      - FINERACT_DEFAULT_TENANTDB_NAME=fineract_default
      - FINERACT_NODE_ID=1
      - FINERACT_REMOTE_JOB_MESSAGE_HANDLER_SPRING_EVENTS_ENABLED=true

volumes:
  mbo-e2e-postgres-data:
