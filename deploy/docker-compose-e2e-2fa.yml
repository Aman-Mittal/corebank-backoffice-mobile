# Overlay for the two-factor suite (adapted from fineract-backoffice-ui):
#
#   docker compose -f deploy/docker-compose-e2e.yml -f deploy/docker-compose-e2e-2fa.yml up -d
#
# FINERACT_SECURITY_2FA_ENABLED registers /v1/twofactor/** and makes every other endpoint answer
# 403 until a one-time token is validated. It is process-wide, so this is a separate stack, never
# run alongside the ordinary one. The token is emailed; Mailpit (MIT, a test-only image, not a
# project dependency) catches it and the spec reads it from Mailpit's HTTP API.
services:
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: mbo-e2e-mailpit
    mem_limit: 128m
    ports:
      - '${MBO_E2E_MAIL_PORT:-8025}:8025'
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true

  backend:
    environment:
      - FINERACT_SECURITY_2FA_ENABLED=true
