# scenario: P1-CLIENTS-019/6
appId: ${APP_ID}
tags:
  - p1
  - backend
---
# A relationship and a client are seeded through the REST API (on the host): the stack ships the
# family member codes empty.
- runScript:
    file: ../../scripts/seed-family.js
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: shell.menu-button
- tapOn:
    id: nav.item.clients
- tapOn:
    id: clients.search
- inputText: ${output.client.lastname}
- hideKeyboard
- tapOn:
    id: 'clients\.row\..*'
    index: 0
- scrollUntilVisible:
    element:
      id: client.family-link
    direction: DOWN
- tapOn:
    id: client.family-link
- assertVisible:
    id: family.screen
- tapOn:
    id: family.add
- tapOn:
    id: family-form.first-name
- inputText: Kin
- hideKeyboard
- tapOn:
    id: family-form.last-name
- inputText: ${output.client.lastname}
- hideKeyboard
- tapOn:
    id: family-form.relationship
- tapOn:
    id: family-form.relationship.option.${output.relationship.id}
- scrollUntilVisible:
    element:
      id: family-form.submit
    direction: DOWN
- tapOn:
    id: family-form.submit
- scrollUntilVisible:
    element:
      text: .*Kin ${output.client.lastname}.*
    direction: DOWN
- assertVisible:
    text: .*Spouse.*
