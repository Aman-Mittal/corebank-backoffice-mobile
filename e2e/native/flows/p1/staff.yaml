# scenario: P1-ORG-002/12
appId: ${APP_ID}
tags:
  - p1
  - backend
---
# The stack starts with no staff: a loan officer is seeded through the REST API (on the host).
- runScript:
    file: ../../scripts/seed-staff.js
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: shell.menu-button
- tapOn:
    id: nav.group.organization
- tapOn:
    id: nav.item.organization.staff
- assertVisible:
    id: staff.screen
- tapOn:
    id: staff.row.${output.staff.id}
- assertVisible:
    id: staff-member.screen
