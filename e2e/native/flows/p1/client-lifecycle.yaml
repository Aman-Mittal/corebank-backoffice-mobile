# scenario: P1-CLIENTS-017/6
appId: ${APP_ID}
tags:
  - p1
  - backend
---
# Seeds an active client and a closure reason through the REST API (runs on the host, not the
# device), so the flow does not depend on what the stack already holds.
- runScript:
    file: ../../scripts/seed-active-client.js
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: shell.menu-button
- tapOn:
    id: nav.item.clients
- tapOn:
    id: clients.search
- inputText: ${output.client.lastname}
- hideKeyboard
- tapOn:
    id: 'clients\.row\..*'
    index: 0
# The actions, and their panel, are below the client's details: scroll to each.
- scrollUntilVisible:
    element:
      id: client.action.close
    direction: DOWN
- tapOn:
    id: client.action.close
- scrollUntilVisible:
    element:
      id: client.action-reason
    direction: DOWN
- tapOn:
    id: client.action-reason
- scrollUntilVisible:
    element:
      text: ${output.client.reason}
    direction: DOWN
- tapOn: ${output.client.reason}
- scrollUntilVisible:
    element:
      id: client.action-confirm
    direction: DOWN
- tapOn:
    id: client.action-confirm
- scrollUntilVisible:
    element:
      id: client.action.reactivate
    direction: DOWN
- tapOn:
    id: client.action.reactivate
- scrollUntilVisible:
    element:
      id: client.action-confirm
    direction: DOWN
- tapOn:
    id: client.action-confirm
- scrollUntilVisible:
    element:
      id: client.action.activate
    direction: DOWN
