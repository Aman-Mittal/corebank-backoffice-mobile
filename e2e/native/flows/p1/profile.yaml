# scenario: P1-SHELL-038/6
appId: ${APP_ID}
tags:
  - p1
  - backend
---
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: shell.menu-button
- assertVisible:
    id: shell.drawer
- tapOn:
    id: nav.item.profile
- assertVisible:
    id: profile.screen
- assertVisible:
    id: profile.username
# The id is on the row's container; Android reports the text on the Text inside it.
- assertVisible:
    text: mifos
- assertVisible:
    id: profile.roles
