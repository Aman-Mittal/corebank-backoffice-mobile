# scenario: P1-CLIENTS-001/5
appId: ${APP_ID}
tags:
  - p1
  - backend
---
# The stack starts with no client charges: a definition and a client are seeded through the REST
# API (on the host), so the flow does not depend on what the stack already holds.
- runScript:
    file: ../../scripts/seed-client-charge.js
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: shell.menu-button
- tapOn:
    id: nav.item.clients
- tapOn:
    id: clients.search
- inputText: ${output.client.lastname}
- hideKeyboard
- tapOn:
    id: 'clients\.row\..*'
    index: 0
- scrollUntilVisible:
    element:
      id: client.charges-link
    direction: DOWN
- tapOn:
    id: client.charges-link
- assertVisible:
    id: charges.screen
- tapOn:
    id: charges.add
- tapOn:
    id: charge-form.charge
- tapOn:
    id: charge-form.charge.option.${output.charge.id}
# The amount starts at the definition's own (100) and the due date at today.
- scrollUntilVisible:
    element:
      id: charge-form.submit
    direction: DOWN
- tapOn:
    id: charge-form.submit
- scrollUntilVisible:
    element:
      text: .*Outstanding 100\.00.*
    direction: DOWN
- assertVisible:
    text: .*E2E Client Fee.*
