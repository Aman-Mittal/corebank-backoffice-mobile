# scenario: P1-CLIENTS-008/8
appId: ${APP_ID}
tags:
  - p1
  - backend
---
# A branch and a client are seeded through the REST API (on the host), so the flow does not
# depend on what the stack already holds.
- runScript:
    file: ../../scripts/seed-client-transfer.js
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: shell.menu-button
- tapOn:
    id: nav.item.clients
- tapOn:
    id: clients.search
- inputText: ${output.client.lastname}
- hideKeyboard
- tapOn:
    id: 'clients\.row\..*'
    index: 0
- scrollUntilVisible:
    element:
      id: client.transfer.proposeAndAcceptTransfer
    direction: DOWN
- tapOn:
    id: client.transfer.proposeAndAcceptTransfer
- scrollUntilVisible:
    element:
      id: client.transfer-office
    direction: DOWN
- tapOn:
    id: client.transfer-office
- scrollUntilVisible:
    element:
      id: client.transfer-office.option.${output.branch.id}
    direction: DOWN
- tapOn:
    id: client.transfer-office.option.${output.branch.id}
- scrollUntilVisible:
    element:
      id: client.transfer-confirm
    direction: DOWN
- tapOn:
    id: client.transfer-confirm
- scrollUntilVisible:
    element:
      text: ${output.branch.name}
    direction: UP
- assertVisible:
    text: ${output.branch.name}
