# EAS: an OTA update to the preview channel from main; store builds from version tags.
# Requires the EXPO_TOKEN secret and an Expo account set as `owner` (see DOCS/RELEASING.md).
name: EAS

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  eas:
    if: ${{ vars.EAS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package.json
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install --no-audit --no-fund
      - run: npm run setup
      - if: github.ref == 'refs/heads/main'
        run: eas update --channel preview --non-interactive --message "${GITHUB_SHA::8}"
      - if: startsWith(github.ref, 'refs/tags/v')
        run: eas build --profile production --platform all --non-interactive --no-wait
