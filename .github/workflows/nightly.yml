# Nightly: the pending probe (expected-red specs must still be red), the two-factor stack, and iOS.
name: Nightly

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pending-probe:
    name: Expected-red specs are still red
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run setup
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/e2e-stack.sh --fresh
      - run: npm run web:export
      # PENDING_PROBE turns every expected-red backend spec from fixme into test.fail(), so a spec
      # that has started passing fails this job and its id can leave expected-red.json.
      - run: npm run e2e:web -- --project=setup --project=backend
        env:
          PENDING_PROBE: '1'

  ios:
    name: Native (iOS simulator, Maestro)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run setup
      - run: npx expo run:ios --configuration Release --no-bundler
      - run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" test e2e/native/flows --exclude-tags=pending -e APP_ID=io.github.amanmittal.mfibackoffice
