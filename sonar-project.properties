# SonarCloud analysis (a hosted service, not a project dependency). Replace the two placeholders
# with your SonarCloud organisation and project key; see DOCS/SONAR.md.
sonar.organization=<sonarcloud-org>
sonar.projectKey=<sonarcloud-org>_mfi-backoffice-mobile
sonar.projectName=MFI Backoffice Mobile

sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**
sonar.exclusions=src/api/generated/**,**/*.d.ts
sonar.coverage.exclusions=src/api/generated/**,src/testing/**,src/app/**,e2e/**
sonar.cpd.exclusions=src/api/generated/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=eslint-report.json
